name: Release DriveGram Android (APK)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da Release no GitHub para anexar o APK (ex: v1.7.8)'
        required: true
      draft_only:
        description: 'Apenas compilar e gerar artefato para teste (sem publicar na release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-publish-android:
    name: Build and Attach Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Apply nodejs-mobile Gradle Patch
        run: node scripts/patch-nodejs-mobile.js

      - name: Build Web Frontend, Embedded Bundle & Capacitor Sync
        run: npm run mobile:sync

      - name: Ensure nodejs-mobile Patch is Applied
        run: node scripts/patch-nodejs-mobile.js

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk DriveGram.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveGram-Android-APK-${{ inputs.release_tag }}
          path: DriveGram.apk
          retention-days: 14

      - name: Upload APK to GitHub Release
        if: ${{ !inputs.draft_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Anexando DriveGram.apk à release ${{ inputs.release_tag }}..."
          gh release upload "${{ inputs.release_tag }}" DriveGram.apk --clobber
