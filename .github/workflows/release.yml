name: Release DriveGram Desktop (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Título do Release'
        required: false
        default: 'DriveGram Desktop Release'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Windows Desktop (Tauri)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install

      - name: Ensure Desktop Node Runtime
        run: npm run ensure:desktop-node

      - name: Build Frontend & Package Embedded Node Server
        run: |
          npm run build
          npm run package:embedded

      - name: Build Desktop & Generate Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.event.inputs.release_title || github.ref_name }}
          releaseBody: 'Atualização do DriveGram para Windows Desktop (com Auto-Update). O APK para Android será anexado após homologação mobile.'
          releaseDraft: false
          prerelease: false
