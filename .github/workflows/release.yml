name: Release DriveGram (PC & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Título do Release'
        required: false
        default: 'DriveGram Multiplatform Release'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Apply nodejs-mobile Gradle Patch
        run: node scripts/patch-nodejs-mobile.js

      - name: Build Web Frontend, Embedded Bundle & Capacitor Sync
        run: npm run mobile:sync

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk DriveGram.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveGram-Android-APK
          path: DriveGram.apk
          retention-days: 7

  build-desktop:
    name: Build Windows Desktop (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install

      - name: Package Embedded Node Server
        run: npm run package:embedded

      - name: Build Desktop & Generate Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.event.inputs.release_title || github.ref_name }}
          releaseBody: 'Atualização multi-plataforma do DriveGram (Windows Desktop com Auto-Update & Android APK).'
          releaseDraft: false
          prerelease: false

  publish-android-to-release:
    name: Publish Android APK to Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: DriveGram-Android-APK

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: DriveGram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
