[build]
  command = "npm run build"
  publish = "dist"

# Redirecionamento SPA para React/Vite no Netlify (evita erro 404 ao atualizar páginas)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança recomendados para hospedagem no Netlify
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
