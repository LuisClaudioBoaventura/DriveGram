<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="shortcut icon" href="/icons/app_icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070e17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DriveGram" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>DriveGram - Cloud Storage sobre Telegram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          if (window.DriveGramAndroidBridge) {
            if (typeof window.DriveGramAndroidBridge.getStatusBarHeightDp === 'function') {
              var sb = window.DriveGramAndroidBridge.getStatusBarHeightDp();
              if (sb > 0) {
                document.documentElement.style.setProperty('--safe-area-inset-top', sb + 'px');
                document.documentElement.style.setProperty('--android-status-bar-height', sb + 'px');
              }
            }
            if (typeof window.DriveGramAndroidBridge.getNavigationBarHeightDp === 'function') {
              var nb = window.DriveGramAndroidBridge.getNavigationBarHeightDp();
              if (nb > 0) {
                document.documentElement.style.setProperty('--safe-area-inset-bottom', nb + 'px');
                document.documentElement.style.setProperty('--android-navigation-bar-height', nb + 'px');
              }
            }
          }
        } catch(e) {}

        var isTauri = typeof window !== 'undefined' && (
          typeof window.__TAURI__ !== 'undefined' ||
          typeof window.__TAURI_INTERNALS__ !== 'undefined' ||
          location.hostname === 'tauri.localhost' ||
          location.protocol === 'tauri:' ||
          location.origin.indexOf('tauri.localhost') !== -1
        );
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        var isCapacitor = window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform();

        if ('serviceWorker' in navigator) {
          if (isTauri || isLocal || isCapacitor) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) {
                  if (names[j].indexOf('drivegram-') === 0) {
                    caches.delete(names[j]);
                  }
                }
              }).catch(function() {});
            }
          } else if (location.protocol === 'https:' || location.protocol === 'http:') {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js').catch(function() {});
            });
          }
        }

        // Se estiver executando no Desktop (Tauri) na URL tauri.localhost, transiciona suavemente para o servidor local 127.0.0.1:5000
        if (isTauri && location.hostname === 'tauri.localhost') {
          var pollServer = function() {
            fetch('http://127.0.0.1:5000/api/health')
              .then(function(res) { return res.json(); })
              .then(function(data) {
                if (data && data.status === 'ok') {
                  window.location.replace('http://127.0.0.1:5000');
                }
              })
              .catch(function() {
                setTimeout(pollServer, 150);
              });
          };
          pollServer();
        }
      })();
    </script>
    <script>
      // Garante compatibilidade com o ciclo de vida do Capacitor (pause/resume) ao rodar no host local
      window.Capacitor = window.Capacitor || {};
      if (typeof window.Capacitor.triggerEvent !== 'function') {
        window.Capacitor.triggerEvent = function(eventName, target, data) {
          try {
            const evt = new CustomEvent(eventName, { detail: data });
            (target === 'document' ? document : window).dispatchEvent(evt);
          } catch (_) {}
          return true;
        };
      }
    </script>
  </head>
  <body class="bg-drive-lightBg dark:bg-drive-darkBg text-gray-900 dark:text-gray-100 font-sans antialiased select-none overscroll-none">
    <div id="root" class="h-full w-full">
      <div id="initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070e17;color:#f8fafc;font-family:sans-serif;z-index:99999;">
        <img src="/icons/icon-192.png" alt="DriveGram" style="width:64px;height:64px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.6);margin-bottom:20px;" />
        <div style="width:36px;height:36px;border:3px solid #1e293b;border-top-color:#eab308;border-radius:50%;animation:dg-spin 0.8s linear infinite;"></div>
        <div style="margin-top:16px;font-size:16px;font-weight:700;letter-spacing:-0.01em;color:#f8fafc;">DriveGram</div>
        <div style="margin-top:6px;font-size:12px;color:#94a3b8;">Iniciando sistema...</div>
      </div>
      <style>
        @keyframes dg-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
